<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MaxGPT-Ultra - reactor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css" />
<style>
  :root{ --bg:#04050a; --edge:#20242e; --green:#33ff9b; --green-dim:#1b6b48;
    --ink:#d8dde6; --mut:#6f7585; --amber:#ffd166; --red:#ff5d6c; --blue:#7fb2ff; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#0b0e16 0%,var(--bg) 60%),var(--bg);
    color:var(--ink);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:linear-gradient(#0d1320 1px,transparent 1px),linear-gradient(90deg,#0d1320 1px,transparent 1px);
    background-size:34px 34px;mask:radial-gradient(120% 90% at 50% 40%,#000 0,transparent 80%)}

  .topbar{position:relative;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 16px;
    border-bottom:1px solid #141823;background:linear-gradient(#0a0d14,#06080d)}
  .topbar .logo{color:var(--green);font-weight:700;letter-spacing:1px;text-shadow:0 0 12px rgba(51,255,155,.5)}
  .topbar .sub{color:var(--mut)}
  .pill{padding:2px 11px;border-radius:999px;border:1px solid #2a2f3a;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
  .pill.running{color:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(51,255,155,.35)}
  .pill.complete{color:var(--blue);border-color:var(--blue)}
  .pill.paused{color:var(--amber);border-color:var(--amber)}
  .pill.error{color:var(--red);border-color:var(--red)}
  .grow{flex:1}
  .stopbtn{background:#10131b;color:var(--mut);border:1px solid #2a2f3a;border-radius:6px;padding:5px 12px;font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:.1em}
  .stopbtn:hover{color:var(--red);border-color:var(--red)}

  /* stage stepper */
  .steps{position:relative;z-index:5;display:flex;align-items:center;gap:6px;padding:9px 16px;border-bottom:1px solid #141823;background:#06080d}
  .step{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9px;border:1px solid var(--edge);
    background:#0c0f16;color:var(--mut);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.2s}
  .step:hover{border-color:#3a3f4b;color:var(--ink)}
  .step.viewing{color:var(--ink);border-color:var(--green);box-shadow:0 0 14px -4px rgba(51,255,155,.5)}
  .step .dot{width:8px;height:8px;border-radius:50%;background:#3a3f4b}
  .step.s-running .dot{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.5s ease-in-out infinite}
  .step.s-done .dot{background:var(--green)} .step.s-ready .dot{background:var(--blue)}
  .step.s-paused .dot{background:var(--amber)} .step.s-error .dot{background:var(--red)}
  .step .sep{color:#2a2f3a}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  .hud{position:relative;z-index:1;height:calc(100vh - 86px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px}
  .panel{position:relative;border-radius:16px;overflow:hidden;min-height:0;
    background:linear-gradient(150deg,#121620 0%,#0a0c12 55%,#070910 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 0 0 1px #20242e, 0 10px 30px -18px #000;
    transition:filter .9s ease, box-shadow .9s ease; filter:saturate(.55) brightness(.82)}
  /* live = steady green edge + glow (no animation) */
  body.live .panel{filter:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1.5px rgba(51,255,155,.55),
               inset 0 0 26px -8px rgba(51,255,155,.35), 0 0 22px -8px rgba(51,255,155,.4)}
  .panel h3{margin:0;padding:7px 13px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;border-bottom:1px solid #161a24;background:linear-gradient(#0c0f16,#090b11)}
  body.live .panel h3{color:var(--green);text-shadow:0 0 10px rgba(51,255,155,.35)}
  .tr h3,.br h3{text-align:right}   /* right-column titles hug the edge, clear of the centered core */
  .tl{grid-column:1;grid-row:1} .bl{grid-column:1;grid-row:2} .tr{grid-column:2;grid-row:1} .br{grid-column:2;grid-row:2}

  .panel.tl{display:flex;flex-direction:column}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#161a24}
  .stat{background:linear-gradient(#0c0f16,#080a10);padding:9px 14px;display:flex;flex-direction:column;justify-content:center}
  .stat .k{color:var(--mut);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em}
  .stat .v{font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}
  body.live .stat .v{color:#eafff4}
  .stat .v small{font-size:11px;color:var(--mut)}
  .samples{flex:1;min-height:54px;overflow:auto;padding:8px 12px;background:#080a10;border-top:1px solid #161a24}
  .samples .sh{color:var(--mut);font-size:9px;text-transform:uppercase;letter-spacing:.13em;margin-bottom:7px}
  .samples .smp{margin-bottom:9px;font-size:11px;line-height:1.45}
  .samples .pr{color:var(--blue)} .samples .co{color:var(--mut);white-space:pre-wrap}
  body.live .samples .co{color:#cfeede}
  .progwrap{grid-column:1 / -1;background:#080a10} .progwrap .bar{height:4px;background:#11151d}
  .progwrap .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--green-dim),var(--green));box-shadow:0 0 12px rgba(51,255,155,.6);transition:width .5s}
  .blbody{display:flex;height:calc(100% - 31px)}
  #term{flex:1;min-width:0;padding:6px 8px}
  .sysmon{width:200px;flex:none;border-left:1px solid #161a24;background:#070910;padding:72px 13px 13px;display:flex;flex-direction:column;gap:13px;overflow:auto}
  .sm-row{display:flex;flex-direction:column;gap:4px}
  .sm-top{display:flex;justify-content:space-between;align-items:baseline}
  .sm-k{color:var(--mut);font-size:9px;text-transform:uppercase;letter-spacing:.12em}
  .sm-v{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
  .sm-bar{height:6px;border-radius:4px;background:#11151d;overflow:hidden}
  .sm-bar>div{height:100%;width:0%;transition:width .6s}
  .sm-bar>div.g{background:linear-gradient(90deg,var(--green-dim),var(--green))}
  .sm-bar>div.a{background:linear-gradient(90deg,#7a5a12,var(--amber))}
  .sm-bar>div.r{background:linear-gradient(90deg,#7a2330,var(--red))}
  .sm-bar>div.b{background:linear-gradient(90deg,#274a6b,var(--blue))}
  .chart{height:calc(100% - 31px);padding:8px 10px} .u-title{color:var(--mut)!important}
  .u-select{background:rgba(51,255,155,.12);border:1px solid rgba(51,255,155,.45)}   /* visible drag-to-zoom box */

  /* reactor core */
  .hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 50% 38%,#1a1f2a 0%,#0a0c12 60%,#05060a 100%);box-shadow:0 0 0 1px #20242e,0 18px 50px -10px #000;display:grid;place-items:center}
  .core{position:relative;width:128px;height:128px;border-radius:50%;cursor:pointer;border:none;
    background:radial-gradient(circle at 50% 32%,#4b515f 0%,#20242d 45%,#0c0e14 100%);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.18),inset 0 -8px 18px rgba(0,0,0,.7),0 0 0 2px #3a3f4b,0 10px 26px -8px #000;
    display:grid;place-items:center;transition:box-shadow .5s,transform .1s}
  .core:active{transform:scale(.97)} .core svg{width:46px;height:46px;fill:#cdd3de;transition:fill .4s}
  .core::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid transparent;transition:border-color .6s,box-shadow .6s}
  body.live .core{box-shadow:inset 0 2px 3px rgba(255,255,255,.22),inset 0 -8px 18px rgba(0,0,0,.6),0 0 0 2px #2c6,0 0 40px rgba(51,255,155,.5)}
  body.live .core svg{fill:#eafff4}
  body.live .core::before{border-color:rgba(51,255,155,.55);box-shadow:0 0 26px rgba(51,255,155,.45);animation:corepulse 2.2s ease-in-out infinite}
  @keyframes corepulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.06);opacity:1}}
  .flood{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(51,255,155,.33),transparent 60%)}
  body.flooding .flood{animation:flood 1.1s ease-out}
  @keyframes flood{0%{opacity:.9;clip-path:circle(6% at 50% 50%)}100%{opacity:0;clip-path:circle(85% at 50% 50%)}}

  /* chat overlay */
  .chatwrap{position:absolute;inset:14px;z-index:6;display:none;flex-direction:column;border-radius:16px;overflow:hidden;
    background:linear-gradient(150deg,#121620,#070910);box-shadow:inset 0 0 0 1px #20242e}
  body.chat-mode .chatwrap{display:flex} body.chat-mode .hud .panel,body.chat-mode .hub{visibility:hidden}
  .chatwrap h3{margin:0;padding:8px 14px;color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.16em;border-bottom:1px solid #161a24}
  .chatlog{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.45}
  .msg.u{align-self:flex-end;background:#15303f;color:#dff} .msg.a{align-self:flex-start;background:#0e1620;border:1px solid #20242e}
  .chatin{display:flex;gap:8px;padding:12px;border-top:1px solid #161a24}
  .chatin input{flex:1;background:#0a0d14;border:1px solid #20242e;border-radius:9px;color:var(--ink);padding:10px 13px;font-family:inherit;font-size:13px}
  .chatin button{background:#13202b;border:1px solid var(--green);color:var(--green);border-radius:9px;padding:0 18px;cursor:pointer;font-family:inherit}
  @media (prefers-reduced-motion: reduce){ .core::before,.step .dot{animation:none!important} }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">◆ MAXGPT-ULTRA</span><span class="sub">reactor</span>
  <span id="pill" class="pill">idle</span><span class="grow"></span>
  <button class="stopbtn" onclick="api('stop')">■ STOP</button>
</div>
<div class="steps" id="steps"></div>

<div class="hud">
  <section class="panel tl"><h3 id="t-title">telemetry</h3>
    <div class="stats">
      <div class="stat"><div class="k">step</div><div class="v" id="s-step">-</div></div>
      <div class="stat"><div class="k">progress</div><div class="v" id="s-prog">-</div></div>
      <div class="stat"><div class="k">loss</div><div class="v" id="s-loss">-</div></div>
      <div class="stat"><div class="k">learning rate</div><div class="v" id="s-lr">-</div></div>
      <div class="stat"><div class="k">tokens / sec</div><div class="v" id="s-tps">-</div></div>
      <div class="stat"><div class="k">grad norm</div><div class="v" id="s-gn">-</div></div>
      <div class="stat"><div class="k">eta</div><div class="v" id="s-eta">-</div></div>
      <div class="stat"><div class="k">stage</div><div class="v" id="s-stage">-</div></div>
      <div class="progwrap"><div class="bar"><div id="progbar"></div></div></div>
    </div>
    <div class="samples" id="samples"><div class="sh">samples · no eval yet</div></div>
  </section>
  <section class="panel tr"><h3 id="loss-h">loss</h3><div class="chart" id="losschart"></div></section>
  <section class="panel bl"><h3>terminal</h3>
    <div class="blbody">
      <div id="term"></div>
      <div id="sysmon" class="sysmon">
        <div class="sm-row"><div class="sm-top"><span class="sm-k">gpu</span><span class="sm-v" id="sm-gpu">-</span></div><div class="sm-bar"><div id="sm-gpu-bar" class="g"></div></div></div>
        <div class="sm-row"><div class="sm-top"><span class="sm-k">vram</span><span class="sm-v" id="sm-vram">-</span></div><div class="sm-bar"><div id="sm-vram-bar" class="a"></div></div></div>
        <div class="sm-row"><div class="sm-top"><span class="sm-k">gpu temp</span><span class="sm-v" id="sm-temp">-</span></div><div class="sm-bar"><div id="sm-temp-bar" class="r"></div></div></div>
        <div class="sm-row"><div class="sm-top"><span class="sm-k">gpu power</span><span class="sm-v" id="sm-pow">-</span></div><div class="sm-bar"><div id="sm-pow-bar" class="b"></div></div></div>
        <div class="sm-row"><div class="sm-top"><span class="sm-k">cpu</span><span class="sm-v" id="sm-cpu">-</span></div><div class="sm-bar"><div id="sm-cpu-bar" class="g"></div></div></div>
        <div class="sm-row"><div class="sm-top"><span class="sm-k">ram</span><span class="sm-v" id="sm-ram">-</span></div><div class="sm-bar"><div id="sm-ram-bar" class="a"></div></div></div>
      </div>
    </div>
  </section>
  <section class="panel br"><h3 id="lr-h">learning rate</h3><div class="chart" id="lrchart"></div></section>
  <div class="hub"><button class="core" id="core" title="play / pause"></button></div>

  <div class="chatwrap">
    <h3>chat · talk to your trained model</h3>
    <div class="chatlog" id="chatlog"></div>
    <div class="chatin"><input id="chatbox" placeholder="ask the model something..." />
      <button onclick="sendChat()">send</button></div>
  </div>
</div>
<div class="flood"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const $=id=>document.getElementById(id);
const core=$('core');
let running=false, wantPlay=false, wantPause=false;
let viewing=null, pinned=false;

const term=new Terminal({fontSize:12,theme:{background:'#070910',foreground:'#bfeede'},convertEol:true,scrollback:6000});
let fitAddon=null; try{ fitAddon=new FitAddon.FitAddon(); term.loadAddon(fitAddon); }catch(e){}
term.open($('term')); if(fitAddon) setTimeout(()=>{try{fitAddon.fit()}catch(e){}},60);
function axis(){return {stroke:'#5a6072',grid:{stroke:'#11151d'},ticks:{stroke:'#11151d'}};}
const ZOOM={};   // per-chart: has the user drag-zoomed? (persist their view across data refreshes)
function mkChart(el,label,color,yfmt,hid,withTrend){ const yc=yfmt?{size:54,values:(u,v)=>v.map(yfmt)}:{};
  const yL=Object.assign(axis(),yc), yR=Object.assign(axis(),yc,{side:1,scale:'y'});  // mirror y-axis on the right, clear of the center hub
  const fy=v=> v==null?'':(yfmt?yfmt(v):(+v).toFixed(3));
  const series=[{},{label,stroke:color,width:2,fill:color+'18',points:{show:false}}];
  if(withTrend) series.push({stroke:'#ffd166',width:3,points:{show:false}});   // amber trend curve (recent log fit, also drives the projection)
  const hook=up=>{ const h=$(hid); if(!h) return; const i=up.cursor.idx;   // hover -> show step + value in the title
    if(i==null){ h.textContent=h._base||label; }
    else { const x=up.data[0][i]; h.textContent=label+' · '+(x==null?'':Math.round(x).toLocaleString())+' · '+fy(up.data[1][i]); } };
  const u=new uPlot({title:label,width:el.clientWidth||420,height:el.clientHeight-26||220,legend:{show:false},
    hooks:{setCursor:[hook],setSelect:[up=>{ if(up.select.width>0) ZOOM[hid]=true; }]},   // drag-select -> stay zoomed
    series,axes:[axis(),yL,yR],scales:{x:{time:false}}},withTrend?[[],[],[]]:[[],[]],el);
  el.addEventListener('dblclick',()=>{ ZOOM[hid]=false; u.setData(u.data,true); });   // double-click -> back to full view
  return u; }
const lossChart=mkChart($('losschart'),'loss','#33ff9b',null,'loss-h',true);
const lrChart=mkChart($('lrchart'),'learning rate','#7fb2ff',v=>v?v.toExponential(1):'0','lr-h',false);
addEventListener('resize',()=>{ for(const[c,id]of[[lossChart,'losschart'],[lrChart,'lrchart']]){const e=$(id);c.setSize({width:e.clientWidth,height:e.clientHeight-26});} if(fitAddon){try{fitAddon.fit()}catch(e){}} });

async function api(a){ try{ await fetch('/api/'+a,{method:'POST'}); }catch(e){} }
function energize(on){ running=on; core.innerHTML=on?PAUSE:PLAY; document.body.classList.toggle('live',on); }
core.onclick=()=>{ if(running){ wantPause=true;wantPlay=false;energize(false);api('pause');setTimeout(()=>wantPause=false,15000); }
  else { wantPlay=true;wantPause=false;document.body.classList.add('flooding');setTimeout(()=>document.body.classList.remove('flooding'),1100);
    energize(true);api('start');setTimeout(()=>wantPlay=false,2600); } };
energize(false);

function setRunning(r){ if(wantPause){ if(!r) wantPause=false; energize(false); return;} if(wantPlay){ if(r) wantPlay=false; energize(true); return;} energize(r); }

function renderSteps(p){
  const el=$('steps'); el.innerHTML='';
  p.stages.forEach((s,i)=>{
    if(i) { const sep=document.createElement('span'); sep.className='sep'; sep.textContent='›'; el.appendChild(sep); }
    const d=document.createElement('div'); d.className='step s-'+s.status+(s.key===viewing?' viewing':'');
    d.innerHTML=`<span class="dot"></span>${s.label}`;
    d.onclick=()=>{ viewing=s.key; pinned=true; document.body.classList.toggle('chat-mode', s.kind==='chat'); pollStage(); renderSteps(p); };
    el.appendChild(d);
  });
  // pill
  let pill='idle';
  if(p.running) pill='running';
  else if(p.stages.some(s=>s.status==='error')) pill='error';
  else if(p.stages.filter(s=>s.kind!=='chat').every(s=>s.status==='done')) pill='complete';
  else if(p.stages.some(s=>s.status==='paused')) pill='paused';
  $('pill').textContent=pill; $('pill').className='pill '+pill;
}

let termKey=null, termN=0;
function renderTerminal(key, lines){ if(key!==termKey){ term.reset(); termKey=key; termN=0; }
  for(let i=termN;i<lines.length;i++) term.writeln(lines[i]); termN=lines.length; }

function linfit(xs,ys,win){ const n=xs.length,s=Math.max(0,n-win); const idx=[]; for(let i=s;i<n;i++) idx.push(i);
  if(idx.length<2) return null;                                  // straight line over the recent window, trimming gross spikes
  let mu=0; for(const i of idx) mu+=ys[i]; mu/=idx.length;
  let v=0; for(const i of idx) v+=(ys[i]-mu)*(ys[i]-mu); const sd=Math.sqrt(v/idx.length);
  const use=sd>0?idx.filter(i=>Math.abs(ys[i]-mu)<=2.5*sd):idx; const u2=use.length>=2?use:idx;
  let sx=0,sy=0,sxx=0,sxy=0,m=u2.length; for(const i of u2){const x=xs[i],y=ys[i];sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}
  const d=m*sxx-sx*sx; if(d===0)return null; const slope=(m*sxy-sx*sy)/d;
  return {slope,intercept:(sy-slope*sx)/m,start:s}; }
function logfit(xs,ys,win){ const s=Math.max(0,xs.length-(win||xs.length)); let sx=0,sy=0,sxx=0,sxy=0,m=0;  // L = a + b*ln(step) over the recent window so it hugs the live points (not warped by the early cliff)
  for(let i=s;i<xs.length;i++){ if(xs[i]>0){ const x=Math.log(xs[i]),y=ys[i]; sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;m++; } }
  if(m<2) return null; const d=m*sxx-sx*sx; if(d===0)return null;
  const b=(m*sxy-sx*sy)/d; return {a:(sy-b*sx)/m,b,start:s}; }
function renderMetrics(metrics){
  let meta=null,last=null,lastEval=null; const xs=[],loss=[],lr=[];
  for(const r of metrics){ if(r.event==='meta'){meta=r;continue} if(r.event==='eval'){lastEval=r;continue} if(r.event) continue;
    if(r.step!==undefined&&r.loss!==undefined){xs.push(r.step);loss.push(r.loss);lr.push(r.lr);last=r;} }
  const lf=linfit(xs,loss,500);   // recent local rate, for the /1k readout (no longer drawn as a line)
  const cf=logfit(xs,loss,1500);  // the amber trend curve: recent log fit that hugs the live points + drives the projection
  const curve=xs.map((x,i)=> (cf&&i>=cf.start)? cf.a+cf.b*Math.log(x) : null);
  let lossBase='loss'; const p=[];
  if(lf){ const r=lf.slope*1000; p.push((r>=0?'+':'')+r.toFixed(3)+'/1k'); }
  if(cf&&meta&&meta.total_steps) p.push('~'+(cf.a+cf.b*Math.log(meta.total_steps)).toFixed(2)+' est');
  if(p.length) lossBase='loss · '+p.join(' · ');
  const lh=$('loss-h'); if(lh){ lh._base=lossBase; if(!lossChart.cursor||lossChart.cursor.idx==null) lh.textContent=lossBase; }
  lossChart.setData([xs,loss,curve], !ZOOM['loss-h']); lrChart.setData([xs,lr], !ZOOM['lr-h']);
  const set=(id,v)=>$(id).textContent=v;
  if(last){ set('s-step',last.step.toLocaleString()); set('s-loss',last.loss.toFixed(3));
    set('s-lr',last.lr!=null?last.lr.toExponential(2):'-'); set('s-tps',last.tok_per_s?Math.round(last.tok_per_s).toLocaleString():'-');
    set('s-gn',last.grad_norm!=null?last.grad_norm.toFixed(2):'-');
    if(meta&&meta.total_steps){ const pct=100*last.step/meta.total_steps; $('s-prog').innerHTML=pct.toFixed(1)+'<small> %</small>'; $('progbar').style.width=Math.min(100,pct)+'%';
      const sps=last.tok_per_s&&meta.tokens_per_step?last.tok_per_s/meta.tokens_per_step:0; set('s-eta',sps?fmtEta((meta.total_steps-last.step)/sps):'-'); } }
  else { for(const id of['s-step','s-prog','s-loss','s-lr','s-tps','s-gn','s-eta']) set(id,'-'); $('progbar').style.width='0%'; }
  renderSamples(lastEval);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderSamples(ev){
  const box=$('samples'); if(!box) return;
  if(!ev||!ev.samples||!ev.samples.length){ box.innerHTML='<div class="sh">samples · no eval yet</div>'; return; }
  const ppl = ev.val_ppl!=null ? Number(ev.val_ppl).toFixed(2) : '-';
  let h='<div class="sh">samples · step '+(ev.step!=null?ev.step.toLocaleString():'-')+' · val ppl '+ppl+'</div>';
  for(const s of ev.samples){ h+='<div class="smp"><span class="pr">'+esc(s.prompt)+'</span> <span class="co">'+esc(s.completion)+'</span></div>'; }
  box.innerHTML=h;
}
function fmtEta(s){ if(!isFinite(s)||s<=0)return '-'; const d=s/86400|0,h=s%86400/3600|0,m=s%3600/60|0; return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`; }

async function pollPipeline(){ try{ const p=await (await fetch('/api/pipeline')).json();
  if(!pinned) viewing=p.current||viewing||(p.stages[1]&&p.stages[1].key);
  document.body.classList.toggle('chat-mode', (p.stages.find(s=>s.key===viewing)||{}).kind==='chat');
  setRunning(p.running); renderSteps(p);
}catch(e){} }
async function pollStage(){ if(!viewing) return; try{ const s=await (await fetch('/api/stage/'+viewing)).json();
  $('t-title').textContent=s.label+' · telemetry'; $('s-stage').textContent=s.status;
  renderTerminal(s.key, s.log||[]); renderMetrics(s.metrics||[]);
}catch(e){} }
setInterval(pollPipeline,800); setInterval(pollStage,800); pollPipeline();

// system resource monitor (right side of the terminal panel)
function smBar(key,frac){ const b=$('sm-'+key+'-bar'); if(b) b.style.width=Math.max(0,Math.min(100,(frac||0)*100))+'%'; }
function smVal(key,txt){ const v=$('sm-'+key); if(v) v.textContent=txt; }
async function pollSys(){ try{ const s=await (await fetch('/api/sysstats')).json();
  if(s.gpu_util!=null){ smVal('gpu',Math.round(s.gpu_util)+'%'); smBar('gpu',s.gpu_util/100); } else { smVal('gpu','no gpu'); smBar('gpu',0); }
  if(s.vram_total_mb){ smVal('vram',(s.vram_used_mb/1024).toFixed(1)+' / '+(s.vram_total_mb/1024).toFixed(1)+' GB'); smBar('vram',s.vram_used_mb/s.vram_total_mb); } else { smVal('vram','-'); smBar('vram',0); }
  if(s.gpu_temp!=null){ smVal('temp',Math.round(s.gpu_temp)+'C'); smBar('temp',s.gpu_temp/100); } else { smVal('temp','-'); smBar('temp',0); }
  if(s.gpu_power!=null){ smVal('pow',Math.round(s.gpu_power)+' W'); smBar('pow',s.gpu_power/250); } else { smVal('pow','-'); smBar('pow',0); }
  if(s.cpu_pct!=null){ smVal('cpu',Math.round(s.cpu_pct)+'%'); smBar('cpu',s.cpu_pct/100); } else { smVal('cpu','pip psutil'); smBar('cpu',0); }
  if(s.ram_total_gb){ smVal('ram',s.ram_used_gb.toFixed(1)+' / '+s.ram_total_gb.toFixed(1)+' GB'); smBar('ram',s.ram_used_gb/s.ram_total_gb); } else { smVal('ram','-'); smBar('ram',0); }
}catch(e){} }
setInterval(pollSys,2000); pollSys();

// chat
async function sendChat(){ const box=$('chatbox'); const msg=box.value.trim(); if(!msg) return; box.value='';
  add('u',msg); const a=add('a','…');
  try{ const r=await (await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})})).json();
    a.textContent=r.reply||'(no reply)'; }catch(e){ a.textContent='(error)'; }
  $('chatlog').scrollTop=1e9;
}
function add(role,text){ const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; $('chatlog').appendChild(d); $('chatlog').scrollTop=1e9; return d; }
$('chatbox').addEventListener('keydown',e=>{ if(e.key==='Enter') sendChat(); });
</script>
