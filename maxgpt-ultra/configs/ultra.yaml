# MaxGPT-Ultra - THE REAL RUN  (~1.1B params)
# Same recipe as the shakedown, scaled up. Batch sizes get tuned to actually
# fit + saturate the 5070's 12GB once we measure on the card.
name: maxgpt-ultra

model:
  vocab_size: 49152      # ~49k byte-level BPE (digit-split + byte fallback)
  d_model: 2048
  n_layers: 22
  n_heads: 16
  n_kv_heads: 4          # GQA
  mlp: swiglu
  mlp_hidden: 5632       # ~8/3 * d_model, rounded to a multiple of 256
  norm: rmsnorm
  pos: rope
  rope_theta: 10000
  qk_norm: true
  tie_embeddings: true
  seq_len: 2048
  # ~1.1B parameters

train:
  precision: auto        # bf16 on Ampere+/Blackwell (the 5070); fp16 + loss scaling on older cards (Lambda's Titans). Same fp32 master weights either way
  gpus: auto             # GPUs per run: 'auto' = every card in CUDA_VISIBLE_DEVICES (torchrun DDP), or a number. 1 on the 5070 box
  optimizer: adamw       # 'muon' optional (see PLAN.md)
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  schedule: wsd
  warmup_tokens: 1.0e9
  total_tokens: 1.0e11   # ~100B target (time-no-object); ship earlier via decay
  decay_frac: 0.15
  z_loss: 1.0e-4
  micro_batch: 4         # per GPU; tune to fit 12GB
  grad_accum: 64         # TOTAL micro-steps per optimizer step across all GPUs: 4*64*2048 = ~0.5M tokens/step (the LR schedule is set by this, so it must not change with the GPU count)
  grad_checkpointing: true
  optimizer_8bit: true   # 8-bit AdamW so optimizer states fit in 12GB
  compile: true          # torch.compile fuses kernels for a big throughput win (auto-falls back to eager if it can't compile)
  compile_modes: [max-autotune-no-cudagraphs, default]   # autotuned kernels without the CUDA-graph memory pool: at 1B the graph saves nothing and costs VRAM
  anneal:                # decay-phase data annealing (docs/research_2026-09-22.md 2.3). Ignored until the shards exist
    shards: data/shards_anneal   # built by scripts/anneal_build.sh (math, non-Python code, ChatML chat)
    frac: 0.4                    # share of every step's windows from the anneal stream once fully on; the rest is unseen original data
    ramp_tokens: 1.0e9           # linear ramp from 0 to frac over this many tokens after the start
    start: decay                 # 'decay' = the WSD decay start step, or an explicit step number
  loss_chunk: 2048       # compute the loss in 2048-position chunks (checkpointed) so the huge logits tensor never materializes -> frees VRAM for a bigger micro_batch

io:
  autosave_minutes: 15
  keep_last_k: 3
  keep_best: true

posttrain:
  # Blend OpenAssistant (oasst1 + oasst2) into the SFT data on top of UltraChat.
  # UltraChat is all long instructional turns; OASST adds the casual/varied chat and
  # greetings it lacks, so the model handles small talk naturally. Ultra only (the
  # shakedown's SFT data is intentionally left as-is).
  sft_extra_oasst: true
  dpo:
    # DPO speedups (no quality change): run it in bf16 + torch.compile like pretrain/SFT,
    # compute the frozen reference's logprobs once then free that whole model, and chunk the
    # 49k-wide logprob math so the giant softmax table never materializes. ~3-5x faster.
    compile: true
    compile_modes: [max-autotune, default]
    precompute_ref: true
    logp_chunk: 2048
